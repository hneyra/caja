name: Frontend

# La interfaz de la ventanilla: sus reglas, sus pruebas y su arnes de navegador (#74).
#
# Es el flujo de `rentas` con el nombre de este sistema, y por eso tiene su misma forma: el
# anfitrion baja a `path: caja` para que el clon hermano `kamayuk-lib` quepa a su lado, porque
# `frontend/package.json` declara las librerias comunes como `link:../../kamayuk-lib/paquetes/*`.
# `actions/checkout` no escribe fuera de `GITHUB_WORKSPACE`, asi que lo que se mueve es este
# repositorio.
#
# Hasta #74 este flujo decia «NO clona `infrastructure` ni nada: no hay una sola dependencia de
# red», y corria siete arneses propios de la maqueta V6. Se fueron con ella.
#
# POR QUE SI LLEVA FILTRO `paths`, AL REVES QUE `publicar-imagenes.yml`: aqui no se publica nada que
# nadie vaya a pedir por su etiqueta, y el filtro evita una instalacion de npm en cada cambio del
# backend. Pero **las guardas de `frontend/verificaciones/` leen archivos de fuera de `frontend/`**
# —`Api.java`, los controladores y los `Resource` que la interfaz lee, `CatalogoDelSistema.java`,
# el compose, el descriptor, este mismo flujo y el de las imagenes—, y un cambio en uno de ellos
# tiene que volver a medirse aqui. Por eso estan en la lista.
#
# LO QUE EL FILTRO NO PUEDE VER: un cambio en `kamayuk-lib`. Eso lo cubre la CI de la libreria,
# que corre `yarn verificar` de este frontend antes de mezclar (su `consumidores.json`).

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml", ".github/workflows/publicar-imagenes.yml", "backend/kamayuk-caja-plataforma/src/main/java/kamayuk/caja/web/Api.java", "backend/kamayuk-caja-nucleo/src/main/java/kamayuk/caja/nucleo/infraestructura/web/**", "backend/kamayuk-caja-seguridad/src/main/java/kamayuk/caja/seguridad/infraestructura/web/**", "backend/kamayuk-caja-seguridad/src/main/java/kamayuk/caja/seguridad/dominio/CatalogoDelSistema.java", "despliegue/compose.yaml", "infrastructure/src/descriptor.ts", "docs/D0-desarrollo/entorno-local.md"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml", ".github/workflows/publicar-imagenes.yml", "backend/kamayuk-caja-plataforma/src/main/java/kamayuk/caja/web/Api.java", "backend/kamayuk-caja-nucleo/src/main/java/kamayuk/caja/nucleo/infraestructura/web/**", "backend/kamayuk-caja-seguridad/src/main/java/kamayuk/caja/seguridad/infraestructura/web/**", "backend/kamayuk-caja-seguridad/src/main/java/kamayuk/caja/seguridad/dominio/CatalogoDelSistema.java", "despliegue/compose.yaml", "infrastructure/src/descriptor.ts", "docs/D0-desarrollo/entorno-local.md"]

permissions:
  contents: read

jobs:
  verificar:
    name: La interfaz cumple sus reglas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Este repositorio
        uses: actions/checkout@v7
        with:
          path: caja

      - name: Las librerias comunes
        uses: actions/checkout@v7
        with:
          repository: hneyra/kamayuk-lib
          path: kamayuk-lib
          token: ${{ secrets.GH_CLONE_KEY || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: caja/frontend/yarn.lock

      - name: Instalar
        working-directory: caja/frontend
        run: yarn install --frozen-lockfile

      - name: Verificar
        working-directory: caja/frontend
        run: yarn verificar

      - name: Construir el bundle
        working-directory: caja/frontend
        run: yarn build

  arnes:
    name: "El arnes: la interfaz se ve, en Chromium"
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    steps:
      - name: Este repositorio
        uses: actions/checkout@v7
        with:
          path: caja

      - name: Las librerias comunes
        uses: actions/checkout@v7
        with:
          repository: hneyra/kamayuk-lib
          path: kamayuk-lib
          token: ${{ secrets.GH_CLONE_KEY || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: caja/frontend/yarn.lock

      - name: Instalar
        working-directory: caja/frontend
        run: yarn install --frozen-lockfile

      - name: Instalar Chromium
        working-directory: caja/frontend
        run: yarn e2e:navegador

      - name: Correr el arnes
        working-directory: caja/frontend
        run: yarn e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: informe-del-arnes
          path: caja/frontend/playwright-report/
          retention-days: 7
