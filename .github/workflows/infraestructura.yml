name: Infraestructura

# Por ahora solo verifica el DESCRIPTOR: en este repositorio todavia no hay codigo de negocio.
# Cuando lo haya (etapa 5) se anade su trabajo, no se cambia este.
#
# `yarn verificar` no necesita Pulumi, ni token, ni cluster. Es deliberado, y es lo que ADR-0011
# compro: la parte que puede equivocarse a diario —un limite que falta, una sonda sin plazo, una
# ruta fuera del prefijo— se detecta en la maquina de quien lo escribe y en el PR de cualquiera.

# POR QUE ESTE FILTRO NOMBRA ARCHIVOS DE `frontend/` Y DE `backend/`
# Desde #17 el descriptor afirma cosas que se cumplen en OTROS archivos, y las lee:
#
#   · `frontend/nginx.conf`, del que lleva una copia caracter a caracter para meterla en un
#     `ConfigMap` — un descriptor es una funcion pura y no puede leerlo al componer;
#   · `frontend/vite.config.ts` y `frontend/src/**`, porque el prefijo que el ingreso quita y la
#     `base` que Vite hornea son dos mitades de una sola decision y tienen que moverse juntas;
#   · `frontend/Dockerfile`, porque `runAsNonRoot` solo lo puede comprobar el kubelet si el `USER`
#     de la imagen es un numero;
#   · `Api.java`, porque la ruta que NO se le quita a la API es su `RAIZ`.
#
# Sin estas lineas, editar solo uno de esos archivos dejaria la comprobacion vieja **en verde**: la
# guarda no se rompe, deja de correr. Es el mismo modo de fallo silencioso que la fila que nadie
# escribe (`registro.yml`) o la tabla que falta en el reparto (#27).
#
# La lista va escrita dos veces, y no por descuido: GitHub Actions **no admite anclas de YAML**
# (`&`/`*`) en un flujo, asi que no hay forma de nombrarla una sola vez.
on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "frontend/nginx.conf"
      - "frontend/vite.config.ts"
      - "frontend/Dockerfile"
      - "frontend/src/**"
      - "backend/kamayuk-caja-plataforma/src/main/java/kamayuk/caja/web/Api.java"
      - ".github/workflows/infraestructura.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - "frontend/nginx.conf"
      - "frontend/vite.config.ts"
      - "frontend/Dockerfile"
      - "frontend/src/**"
      - "backend/kamayuk-caja-plataforma/src/main/java/kamayuk/caja/web/Api.java"
      - ".github/workflows/infraestructura.yml"

# Sin permisos de escritura: este trabajo lee y verifica, no publica nada.
permissions:
  contents: read

jobs:
  descriptor:
    name: El descriptor cumple el contrato
    runs-on: ubuntu-latest
    # Un colgado no consume cuota sin limite: la leccion de `observabilidad-alertas`.
    timeout-minutes: 10
    steps:
      # ESTE repositorio, y **no** en la raiz del espacio de trabajo (C-9a).
      #
      # `infrastructure/package.json` declara `@kamayuk/infra-contrato` como
      # `link:../../infrastructure/infra/contrato`: un hermano. Eso lo resuelve yarn al
      # instalar, contra el disco, y **ninguna variable de entorno lo redirige** — asi que
      # aqui la disposicion de hermanos no es una preferencia, esta escrita en el
      # `package.json`.
      #
      # En CI no se puede reproducir clonando hacia arriba: `actions/checkout` se NIEGA a
      # escribir fuera de `GITHUB_WORKSPACE` —«Repository path
      # '/home/runner/work/infrastructure/sgtm' is not under
      # '/home/runner/work/infrastructure/infrastructure'», que es como se descubrio—. Asi
      # que lo que se mueve es el ANFITRION: este repositorio se clona en
      # `<espacio>/caja`, el hermano en `<espacio>/infrastructure`, y el `link:`
      # resuelve exactamente igual que en la maquina de quien lo escribe.
      #
      # `path: infrastructure` a secas **no vale**: chocaria con el directorio
      # `infrastructure/` que este repositorio ya tiene dentro.
      - uses: actions/checkout@v4
        with:
          path: caja

      # El contrato vive en `infrastructure`, y la dependencia es `link:` a un repositorio
      # hermano. En CI ese hermano no esta, asi que se clona al lado — con la MISMA estructura
      # de directorios que en local, o el `link:` no resuelve.
      - name: Traer el contrato de `infrastructure`
        uses: actions/checkout@v4
        with:
          repository: hneyra/infrastructure
          path: infrastructure
          # Los cinco repositorios del producto son PRIVADOS y el `GITHUB_TOKEN` solo
          # alcanza al suyo: sin esto, `Not Found` al pedir la rama por omision.
          token: ${{ secrets.GH_CLONE_KEY || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar
        working-directory: caja/infrastructure
        run: yarn install --frozen-lockfile

      - name: Verificar el descriptor
        working-directory: caja/infrastructure
        run: yarn verificar
