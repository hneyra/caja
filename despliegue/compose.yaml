# ============================================================================
#  CAJA, LEVANTADO CONTRA LA PLATAFORMA (ADR-0031 §4, C-18)
#
#  Solo lo de este sistema: su migrador, su implantacion y su backend. NO trae
#  PostgreSQL ni Keycloak — los usa, y los levanta el compose de la plataforma,
#  que vive en el clon hermano `infrastructure`:
#
#      docker compose -f ../infrastructure/despliegue/plataforma.compose.yaml up -d --wait
#      docker compose -f despliegue/compose.yaml \
#          --env-file ../infrastructure/despliegue/.env up --build --wait
#
#  EL `--env-file` NO SOBRA, y `env_file:` NO lo sustituye (#74). Este compose interpola
#  cinco `${KAMAYUK_CLAVE_*:?}` que salen del `.env` de la PLATAFORMA, y Compose busca
#  `.env` en el directorio del proyecto —el de este archivo—, donde no hay ninguno.
#  Medido el 2026-09-13: sin `--env-file`, `docker compose config` sale **1** con
#  «required variable KAMAYUK_CLAVE_APP is missing a value»; con el, **0**.
#
#  Y `env_file:` se probo y NO vale: alimenta el entorno del CONTENEDOR, no la
#  interpolacion, asi que el mismo `config` vuelve a salir 1 con el error identico.
#  Un enlace `.env` junto a este archivo si funcionaria —medido, exit 0—, pero `.env`
#  esta en `.gitignore` en los seis repositorios y des-ignorarlo para versionar un
#  enlace es como se acaban subiendo credenciales.
#
#  ESTE ARCHIVO Y EL DESCRIPTOR TIENEN QUE DECIR LO MISMO. Es la trampa que
#  ADR-0011 anoto —«dos formas de levantar el sistema, que se separen, que una
#  variable nueva entre en el cluster y no en el compose»— y con cuatro sistemas
#  se multiplica por cuatro. Lo que lo sujeta es una guarda de `infrastructure`,
#  `infra/verificaciones/compose-de-los-sistemas.test.ts`, que lee este archivo y
#  `infrastructure/src/descriptor.ts` y compara las dos mitades: los nombres de
#  las variables de entorno de cada proceso, la base a la que apunta cada uno, el
#  rol con que se conecta, el prefijo de la ruta y los dos objetivos del
#  Dockerfile. No se copia una lista a mano: se derivan las dos y se comparan.
#
#  Y DESDE #18 SI HAY FRONTEND. Hasta aqui este bloque decia «AQUI NO HAY
#  FRONTEND, y no es un olvido», porque no lo habia: ADR-0030 §1 decide que habra
#  uno por sistema y ninguno de los cuatro existia. `C-18 — el compose de los
#  cuatro` dejo escrito cuando entraria —«El frontend no se inventa. […] Cuando
#  exista, entra en el compose de su sistema»—, y `caja-web` existe desde #3, con
#  su imagen publicada desde #16 y su descriptor desde #17. Entra.
#
#  Y DESDE #74 ES OTRO FRONTEND: la maqueta V6 se retiro y la interfaz se rehizo
#  con el stack de `rentas-web`, sobre `../kamayuk-lib`. Habla con su backend —solo
#  con el suyo, ADR-0042—, pero lo hace el NAVEGADOR y a traves de Traefik: el
#  contenedor sigue sin `depends_on`, sin reenviar nada y sin leer una variable de
#  este compose. Por eso el backend se estrecha a `/caja/api/v1` y la interfaz se
#  queda con `/caja`, cada una con su prioridad.
# ============================================================================

name: kamayuk-caja

services:
  # ── El migrador, que corre y termina ────────────────────────────────────────
  #
  # La imagen del MIGRADOR, no la de la aplicacion (C-14, punto 1): son dos
  # objetivos del mismo `Dockerfile` y estan separados porque las credenciales de
  # `kamayuk_owner` —el unico rol con DDL— existen durante la migracion y desaparecen
  # con ella. Meterlas en la imagen de la aplicacion le daria DDL sobre el padron
  # a un proceso de larga vida expuesto en HTTP (ARQ-03 §4).
  #
  # Lee `KAMAYUK_DB_OWNER_USUARIO` y `KAMAYUK_DB_OWNER_CLAVE`, y NO `KAMAYUK_DB_USUARIO`:
  # lo dice el `main` de `kamayuk.caja.esquema.Migrador`, que rechaza
  # argumentos a proposito para que una clave no quede en el historial del proceso.
  caja-migraciones:
    build:
      # El contexto es la RAIZ del repositorio, no `backend/`: el `.dockerignore`
      # que lo acota vive alli y desde `backend/` no se aplica.
      context: ..
      dockerfile: backend/Dockerfile
      target: migrador
    image: kamayuk-caja-migrador:compose
    environment:
      # `base` es el servicio del compose de la plataforma, no `postgres`. En el
      # cluster es otro nombre y lo entrega el entorno (C-17, punto 1): el
      # descriptor pide `e.plataforma.motor` en vez de escribirlo. Lo que si es de
      # este sistema —y por eso coincide en los dos— es el nombre de SU base.
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/caja
      KAMAYUK_DB_OWNER_USUARIO: kamayuk_owner
      KAMAYUK_DB_OWNER_CLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
    # Corre y termina. Si se reinicia vuelve a comprobar el ambiente y no aplica
    # nada: el migrador es idempotente y tiene su prueba que lo demuestra.
    restart: "no"

  # ── La implantacion: la fila de `municipalidad` en SU base ───────────────────
  #
  # La MISMA imagen que la aplicacion con el perfil `batch` (ADR-0003: un
  # artefacto, dos perfiles), asi que no abre ningun puerto y termina al acabar.
  #
  # En el cluster el migrador va de `initContainer` de este Job, porque un
  # `Deployment` no sabe esperar a un `Job` y Kubernetes no tiene `dependsOn`.
  # Aqui `depends_on: service_completed_successfully` es exactamente esa espera, y
  # por eso el orden se expresa como dependencia y no repitiendo el migrador.
  caja-implantacion:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-caja:compose
    depends_on:
      caja-migraciones:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: batch
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/caja
      # `kamayuk_app` y solo `kamayuk_app`: sin DDL, sin BYPASSRLS, sin DELETE y
      # propietario de nada.
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # Las dos de ADR-0026 §4 van en el bloque COMUN del `application.yaml`, asi
      # que las necesita TODO proceso de este sistema y no solo el perfil `web`:
      # sin ellas Spring no puede resolver el marcador y el contexto muere antes
      # de hacer nada. Lo destapo C-14 midiendo el Job de implantacion, que no
      # habria levantado — y el sintoma habria sido un despliegue colgado
      # esperando una municipalidad que nadie implanto.
      KAMAYUK_CAJA_RESPONSABLE: ${KAMAYUK_RESPONSABLE_DE_OPERACION:?falta KAMAYUK_RESPONSABLE_DE_OPERACION en el .env de la plataforma}
      KAMAYUK_CAJA_CANAL: ${KAMAYUK_CANAL_DE_OPERACION:?falta KAMAYUK_CANAL_DE_OPERACION en el .env de la plataforma}
      # El prefijo es `kamayuk.implantacion`, y desde R-A/B lo es en los cuatro. Hasta
      # entonces `rentas` leia `sgtm.implantacion` —era el monolito— y la asimetria dejo
      # SU Job de implantacion saliendo con codigo 0 sin implantar nada (C-18 §5). Lo que
      # impide ahora apuntar esta implantacion con las variables de otro no es que el
      # nombre difiera, sino la guarda que compara cada descriptor con SU Java.
      KAMAYUK_IMPLANTACION_UBIGEO: ${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_NOMBRE: ${KAMAYUK_MUNICIPALIDAD:?falta KAMAYUK_MUNICIPALIDAD en el .env de la plataforma}
      KAMAYUK_IMPLANTACION_TIPO: ${KAMAYUK_TIPO_DE_MUNICIPALIDAD:-DISTRITAL}
      # La cuenta TIENE que ser la misma que el usuario de Keycloak: es lo unico
      # que une la fila de `usuario` con la identidad del token (ADR-0005).
      KAMAYUK_IMPLANTACION_ADMINISTRADOR: ${KAMAYUK_ADMINISTRADOR:?falta KAMAYUK_ADMINISTRADOR (ver identidad/datos-de-implantacion.sh)}
      KAMAYUK_IMPLANTACION_NOMBREDELADMINISTRADOR: ${KAMAYUK_NOMBRE_DEL_ADMINISTRADOR:-Administrador del sistema}
      # Por omision `true`, al reves que en el codigo: aqui se levanta una marcha
      # blanca, y mientras D-02a siga abierta toda cifra sale de parametros que
      # nadie ha firmado. Solo se aplica al ALTA.
      KAMAYUK_IMPLANTACION_ESDEMOSTRACION: ${KAMAYUK_ES_DEMOSTRACION:-true}
      KAMAYUK_IMPLANTACION_URL: jdbc:postgresql://base:5432/caja
      # OWNERCLAVE sin guion bajo: en una variable de entorno el `_` se traduce a
      # punto, asi que `KAMAYUK_IMPLANTACION_OWNER_CLAVE` seria
      # `kamayuk.implantacion.owner.clave` y no `owner-clave`.
      KAMAYUK_IMPLANTACION_OWNERCLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER, sale del .env de la plataforma}
      # ── El consumidor del buzon de `identidad` (ADR-0039, etapa 4) ──────────────
      #
      # La implantacion termina con una pasada del consumidor, y desde la etapa 5 de
      # ADR-0039 NO TERMINA SIN ELLA: aqui ya no se siembra ni un usuario, ni un grupo,
      # ni un permiso —eso es de `identidad`—, asi que sin estas variables el Job falla
      # nombrandolas en vez de dejar la municipalidad dada de alta y sin nadie que pueda
      # entrar. Son las MISMAS cuatro variables que lleva el `CronJob` del descriptor, y
      # tienen que decir lo mismo.
      #
      # (Hasta la etapa 4 esto decia «los dos grupos que siembra `SembradorDeLaCopiaLocal`»
      # y era falso: aquel sembrador creaba UNO, y desde la etapa 5 no crea ninguno.)
      #
      # `identidad-sistema` y no `identidad`: en la red `kamayuk-plataforma` el alias
      # `identidad` lo tiene Keycloak, y el backend de `identidad` se llama
      # `identidad-sistema` en SU compose por eso mismo. La raiz va ENTERA, con su
      # prefijo: `Api.RAIZ` de `identidad` es `/identidad/api/v1`.
      KAMAYUK_IDENTIDAD_URL: http://identidad-sistema:8080/identidad/api/v1
      # A donde se pide el token, por la red interna (#21 AC-2). Es Keycloak, y aqui SI
      # se llama `identidad`.
      KAMAYUK_IDENTIDAD_TOKEN: http://identidad:8080/realms/kamayuk/protocol/openid-connect/token
      # El MISMO cliente confidencial que el publicador de pagos: uno por municipalidad
      # (ADR-0028 §2). Lo que cambia es la clave, que es del par (caja, identidad).
      KAMAYUK_IDENTIDAD_CLIENTE: kamayuk-caja-servicio-${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      # VACIA por omision a proposito, como `KAMAYUK_CAJA_CREDENCIAL`: en el compose la
      # identidad de servicio se crea a mano. LO QUE CUESTA NO PONERLA CAMBIA EN LA
      # ETAPA 5: la llamada sale sin credencial, `identidad` contesta 401 y la
      # implantacion FALLA — hasta la etapa 4 lo decia y terminaba, porque la copia
      # local la sembraba ella; ya no la siembra nadie, asi que terminar seria dejar la
      # municipalidad sin un solo usuario y el Job en Complete.
      KAMAYUK_IDENTIDAD_CREDENCIAL: ${KAMAYUK_CAJA_CREDENCIAL_IDENTIDAD:-}
    restart: "no"

  # ── El backend ──────────────────────────────────────────────────────────────
  #
  # EL SERVICIO SE LLAMA COMO EL SISTEMA, y no `aplicacion`. No es estilo: los
  # cuatro composes comparten la red `kamayuk-plataforma`, y Compose le da a cada
  # servicio un alias de red con su nombre — cuatro servicios llamados
  # `aplicacion` dejarian ese alias resolviendo a uno cualquiera de los cuatro.
  # Ademas es el nombre que la propia aplicacion da por hecho: el valor por
  # omision de `kamayuk.caja.origenes` es `http://rentas:8080/rentas/api/v1`.
  caja:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    image: kamayuk-caja:compose
    depends_on:
      caja-implantacion:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: web
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/caja
      KAMAYUK_DB_USUARIO: kamayuk_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP, sale del .env de la plataforma}
      # Sin el emisor la aplicacion se NIEGA a arrancar, y es deliberado: un
      # backend que atiende sin poder validar un token responde a la sonda, se
      # declara sano y no atiende a nadie (ADR-0005).
      #
      # Es el MISMO realm que los otros tres: un login para los cuatro
      # (ADR-0030 §3).
      KAMAYUK_OIDC_EMISOR: ${KAMAYUK_OIDC_EMISOR:-http://localhost:8180}/realms/kamayuk
      # El emisor es una identidad, no una direccion de red. El navegador llega a
      # Keycloak por su nombre publico y este contenedor por el interno de la red
      # del compose; usar el publico para las dos cosas haria que el backend
      # buscara el JWKS en si mismo y todo token seria invalido por un motivo que
      # no se parece a su causa.
      KAMAYUK_OIDC_JWKS: http://identidad:8080/realms/kamayuk/protocol/openid-connect/certs
      # Y el punto de EMISION, por la misma red interna y por lo mismo (#21 AC-2): el
      # publicador del buzon corre sin usuario delante —lo despierta un reloj— y pide su
      # token con `client_credentials`.
      KAMAYUK_CAJA_IDENTIDAD_TOKEN: http://identidad:8080/realms/kamayuk/protocol/openid-connect/token
      # Con QUE cliente lo pide: uno por municipalidad, porque la cuenta de servicio de ese
      # cliente es la que lleva `municipalidad_id` (ADR-0028 §2). El ubigeo es el mismo que
      # implanta este compose.
      KAMAYUK_CAJA_IDENTIDAD_CLIENTE: kamayuk-caja-servicio-${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en el .env de la plataforma}
      # Y su clave. VACIA por omision a proposito: en el compose la identidad de servicio hay
      # que crearla a mano (`identidad/reconciliar-identidades.sh servicios`), y mientras no
      # exista lo correcto es que la llamada salga sin credencial y `rentas` la rechace — no
      # que la caja se pase la vida pidiendo tokens que nadie va a dar.
      KAMAYUK_CAJA_CREDENCIAL: ${KAMAYUK_CAJA_CREDENCIAL:-}
      # A donde se le entrega el evento de cada pago (ADR-0026 §3). Es un MAPA por
      # nombre de sistema y no una direccion unica: la caja no sabe cuantos
      # sistemas hay, y el dia que aparezca `mercados` tiene que ser una linea
      # aqui y no un despliegue de la caja.
      #
      # `rentas` es el nombre del SERVICIO del compose de ese sistema — por eso
      # los cuatro backends se llaman como su sistema y no `aplicacion`.
      # Entrecomillado: el valor lleva dos puntos dentro y YAML lo leeria como un
      # mapa.
      KAMAYUK_CAJA_ORIGENES: "{rentas: 'http://rentas:8080/rentas/api/v1'}"
      # QUIEN recibe el aviso cuando hay dinero cobrado sin registrar
      # (ADR-0026 §4). La aplicacion NO ARRANCA sin las dos —lo comprueba
      # `ResponsableDeLaConciliacion` al construirse—, y eso es deliberado: una
      # alerta sin destinatario acaba en un panel que nadie mira.
      KAMAYUK_CAJA_RESPONSABLE: ${KAMAYUK_RESPONSABLE_DE_OPERACION:?falta KAMAYUK_RESPONSABLE_DE_OPERACION en el .env de la plataforma}
      KAMAYUK_CAJA_CANAL: ${KAMAYUK_CANAL_DE_OPERACION:?falta KAMAYUK_CANAL_DE_OPERACION en el .env de la plataforma}
    labels:
      # Su prefijo, y SOLO el suyo. Reclamar el de otro no falla: se lo queda, y
      # las peticiones dejan de llegar a su dueno. Es la misma prohibicion (a) que
      # `descriptor/auditoria.ts` aplica en el cluster.
      #
      # DESDE #74 EL BACKEND SE QUEDA SOLO CON `/caja/api/v1`, como en `rentas`.
      # Hasta entonces reclamaba `/caja` entero y la interfaz no tenia etiquetas:
      # se entraba a ella por su puerto. Ahora la interfaz va detras de Traefik
      # bajo `/caja`, y dos enrutadores con el mismo prefijo no dan error: se lo
      # reparten.
      #
      # La PRIORIDAD va escrita. Traefik v3 ordena por longitud de la regla cuando
      # nadie la declara, y `/caja/api/v1` es mas larga que `/caja`, asi que hoy
      # saldria bien POR ACCIDENTE. El fallo al reves no grita: la API la
      # contestaria el nginx, cuyo `try_files` devuelve el `index.html` con un
      # **200**, y la pantalla recibiria HTML donde espera JSON.
      - traefik.enable=true
      - traefik.http.routers.caja.rule=PathPrefix(`/caja/api/v1`)
      - traefik.http.routers.caja.priority=20
      - traefik.http.services.caja.loadbalancer.server.port=8080
    healthcheck:
      # `/actuator/health` y no `/actuator/health/liveness`: aqui esta sonda
      # alimenta `depends_on: service_healthy`, o sea «esta listo para atender», y
      # el grupo entero incluye el indicador de la base. En el cluster son tres
      # sondas distintas y la de VIDA es la del grupo `liveness` a proposito
      # (C-17, punto 2): matar el proceso no devuelve la base.
      #
      # Las tres rutas —esta y las dos del descriptor— tienen que estar entre las
      # que `SeguridadWeb` permite sin token, y eso lo comprueba
      # `sondas-contra-la-cadena` leyendo el Java. Con la cadena anterior a C-17
      # esto contestaba 401 y `curl --fail` dejaba el contenedor `unhealthy` para
      # siempre, con la aplicacion sana.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  # ── La interfaz de ventanilla ───────────────────────────────────────────────
  #
  # `caja-web` compilado y servido por nginx. La imagen es `kamayuk-caja-interfaz`
  # (#16) y NUNCA `kamayuk-caja-web`: ese nombre ya es el del BACKEND con el perfil
  # `web` de Spring, y darselo aqui seria un `Service` repartiendo entre dos cosas
  # distintas.
  #
  # POR QUE SE LLAMA `caja-interfaz` Y NO `interfaz`
  #
  # Por lo mismo que el backend se llama `caja` y no `aplicacion`, escrito unas
  # lineas mas arriba: los cuatro composes comparten la red `kamayuk-plataforma` y
  # Compose le da a cada servicio un alias de red con su nombre. Hoy `interfaz` no
  # lo declara nadie mas en esa red —medido: la plataforma trae `base`, `correo`,
  # `identidad` e `ingreso`, y `rentas` y `catastro` solo sus tres procesos—, pero
  # ADR-0030 §1 dice que habra CUATRO interfaces, y el dia de la segunda ese alias
  # resolveria a una cualquiera de las dos. El sintoma de eso no es un error: es
  # una peticion que a veces llega a quien no era. El nombre generico se corrige
  # ahora, en un repositorio, o mas tarde en cuatro.
  #
  # (El `interfaz` a secas del monolito no choca con este: su compose se llama
  # `sgtm` y NO declara `networks`, asi que vive en su propia red `sgtm_default`.
  # Medido sobre `infrastructure/despliegue/compose.yaml`.)
  #
  # SIN `depends_on`, Y ESO ES UNA AFIRMACION
  #
  # Esta interfaz no necesita el backend para nada: sus datos salen de
  # `frontend/src/datos/`, su `nginx.conf` no reenvia a ningun sitio —el del
  # monolito si, y esa ausencia es la afirmacion principal de aquel archivo— y
  # `eslint.config.mjs` prohibe `fetch` en el codigo. Declarar aqui una dependencia
  # que no existe costaria dos cosas: haria que el compose MINTIERA sobre el grafo
  # —que es justo lo que la guarda de `infrastructure` compara contra el
  # descriptor—, y obligaria a `up -d caja-interfaz` a levantar antes la base, el
  # migrador y la implantacion para dibujar una pantalla que no los usa.
  #
  # El dia que esta interfaz lea algo de verdad, esa linea entra CON su motivo, y
  # entonces `nginx.conf` tendra que reenviar y `Identidad.ts` tendra que darle un
  # cliente publico (ver `docs/00-gobierno/huecos-en-infrastructure.md`).
  #
  # Lo unico que SI necesita de fuera es la red `kamayuk-plataforma`, porque este
  # archivo entero la declara `external: true` (ver el final). O sea que
  # `up -d caja-interfaz` no arranca el migrador ni la implantacion ni el backend,
  # pero exige que la plataforma este levantada. Sin ella Compose se niega, que es
  # mejor que crear una segunda red con el mismo nombre.
  caja-interfaz:
    build:
      # El contexto es `frontend/` y no la raiz, al reves que los tres de arriba:
      # el `.dockerignore` que lo acota —`frontend/.dockerignore`— solo se aplica
      # desde la raiz del contexto, y el de la raiz excluye `frontend/` entero.
      context: ../frontend
      # Y desde #74, el clon hermano por un CONTEXTO CON NOMBRE, como en `rentas`:
      # `frontend/package.json` declara las librerias comunes como `link:` a
      # `../../kamayuk-lib`. Sin esta clave, `COPY --from=kamayuk-lib` no es ni una
      # etapa ni un contexto declarado, y BuildKit se va a buscar la imagen
      # `docker.io/library/kamayuk-lib:latest`. `despliegue/../../kamayuk-lib` y
      # `frontend/../../kamayuk-lib` son el mismo directorio. Pide `docker compose`
      # >= v2.17.0.
      additional_contexts:
        kamayuk-lib: ../../kamayuk-lib
      target: interfaz
    image: kamayuk-caja-interfaz:compose
    # EL PUERTO LLEVA EL SUFIJO DEL SISTEMA, y no es capricho: `KAMAYUK_PUERTO_INTERFAZ`
    # a secas lo usa la interfaz del monolito con el MISMO `.env`, y con el delante el
    # valor por omision de aqui no se aplicaria nunca (#39).
    #
    # PARA QUE SIRVE, existiendo Traefik (#74): para mirar el nginx SIN el ingreso
    # delante. Hasta #74 era la unica entrada y su nginx servia dos —la raiz y
    # `/caja/`, reescrita (#42)—; desde #74 la entrada de verdad es
    # `http://localhost:8080/caja/`, por Traefik, y por este puerto `/caja/...` cae en
    # el bloque de `frontend/nginx.conf` que contesta 404 diciendo que falta el
    # `stripprefix`. Es exactamente lo que se quiere poder distinguir cuando algo no
    # llega.
    ports:
      - "${KAMAYUK_PUERTO_INTERFAZ_CAJA:-8082}:8080"
    labels:
      # La otra mitad del reparto. Prioridad MENOR que la de la API, escrita: ver la
      # nota del servicio `caja`. Y aqui SI se quita el prefijo, porque este nginx
      # sirve en la raiz de su contenedor; que el paquete lo pida con el prefijo
      # puesto lo garantiza `vite.config.ts` con `base: '/caja/'` (ADR-0030 §2).
      - traefik.enable=true
      - traefik.http.routers.caja-interfaz.rule=PathPrefix(`/caja`)
      - traefik.http.routers.caja-interfaz.priority=10
      - traefik.http.routers.caja-interfaz.middlewares=caja-quitar-prefijo
      - traefik.http.middlewares.caja-quitar-prefijo.stripprefix.prefixes=/caja
      - traefik.http.services.caja-interfaz.loadbalancer.server.port=8080
    # SIN `healthcheck` aqui: `frontend/Dockerfile` declara el suyo, pidiendo
    # `/index.html` por su nombre, y Docker aplica el `HEALTHCHECK` de la imagen al
    # contenedor.
    #
    # Y SIN `depends_on`: esta interfaz lee su API por el navegador, a traves de
    # Traefik, y no depende de que el backend este levantado para servir sus
    # archivos. Una dependencia inventada haria que el compose mintiera sobre el
    # grafo que compara la guarda de `infrastructure`.

# La red de la plataforma, QUE YA EXISTE. `external: true` es lo que impide que
# este compose cree una segunda con el mismo nombre y deje a los servicios sin
# verse: el sintoma seria «Connection refused» a `base`, que se lee como que el
# motor no esta levantado.
networks:
  default:
    name: kamayuk-plataforma
    external: true
